<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ebû Bekir er-Râzî'nin Kazanı</title>
  <style>
    /* ── Değişkenler ── */
    :root {
      color-scheme: dark;
      --bg:      #110d0b;
      --panel:   #211810;
      --border:  #6a4628;
      --ink:     #f0e4c8;
      --muted:   #a09278;
      --gold:    #d4a848;
      --gold-lt: #f0c86e;
      --green:   #52b982;
      --green-lt:#78dca5;
      --red:     #c84b3c;
      --red-lt:  #eb6a5a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background:
        radial-gradient(ellipse at 10% 0%,   #5a321a 0, transparent 38%),
        radial-gradient(ellipse at 90% 100%, #1a2f25 0, transparent 38%),
        linear-gradient(160deg, #0e0b09, #281a10);
      color: var(--ink);
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 10px 20px;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }

    header {
      width: 100%;
      max-width: 540px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .logo {
      font-size: clamp(1.0rem, 4.2vw, 1.35rem);
      color: var(--gold);
      line-height: 1.2;
    }
    .logo small {
      display: block;
      font-size: .68em;
      color: var(--muted);
      font-style: italic;
    }
    .room-badge {
      font-size: .72rem;
      letter-spacing: .12em;
      color: var(--gold-lt);
      text-align: right;
      flex-shrink: 0;
    }
    .room-badge span {
      display: block;
      font-size: .6rem;
      color: var(--muted);
    }

    .status-wrap {
      width: 100%;
      max-width: 540px;
      margin-bottom: 8px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #211810cc;
      font-size: .88rem;
      color: var(--gold);
      transition: color .3s, border-color .3s;
    }
    .status::before {
      content: '';
      flex: 0 0 8px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px var(--gold);
    }
    .status.ready   { color: var(--green-lt); border-color: #3d7054; }
    .status.ready::before { background: var(--green); box-shadow: 0 0 10px var(--green); }
    .status.error   { color: var(--red-lt);   border-color: #7a3228; }
    .status.error::before { background: var(--red); box-shadow: 0 0 10px var(--red); }

    .timer-wrap {
      width: 100%;
      max-width: 540px;
      margin-bottom: 8px;
      display: none;
    }
    .timer-wrap.visible { display: flex; align-items: center; gap: 8px; }
    .timer-bar-bg {
      flex: 1;
      height: 7px;
      background: #2e1e10;
      border-radius: 4px;
      overflow: hidden;
    }
    .timer-bar-fill {
      height: 100%;
      width: 100%;
      border-radius: 4px;
      background: var(--green);
      transition: width .9s linear, background .4s;
    }
    .timer-bar-fill.warn  { background: var(--gold); }
    .timer-bar-fill.urgent { background: var(--red); }
    .timer-label {
      font-size: .72rem;
      color: var(--muted);
      min-width: 26px;
      text-align: right;
    }

    main {
      width: 100%;
      max-width: 540px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Buton Izgarası ── */
    .buttons-container {
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .buttons.many-cols {
      grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
    }
    .buttons.disabled button {
      opacity: .35;
      pointer-events: none;
      filter: grayscale(50%);
      transform: scale(.98);
    }

    button.mat-btn {
      position: relative;
      min-height: 85px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      color: #fff8e8;
      font: 700 .95rem Georgia, serif;
      cursor: pointer;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.35), 0 4px 12px rgba(0,0,0,0.3);
      transition: transform .12s, filter .12s;
      text-shadow: 0 1px 4px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 4px;
    }
    button.mat-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(255,255,255,0.15) 0%, transparent 60%);
      pointer-events: none;
    }
    button.mat-btn:active {
      transform: translateY(2px) scale(.97);
      filter: brightness(1.2);
    }
    button.mat-btn.pressed {
      animation: btn-press .2s ease-out;
    }
    @keyframes btn-press {
      40% { transform: translateY(2px) scale(.95); filter: brightness(1.25); }
    }

    .symbol {
      display: block;
      font-size: 1.6rem;
      font-weight: 400;
      margin-bottom: 3px;
      text-shadow: 0 0 10px rgba(255,255,255,0.4);
    }
    .mat-name {
      font-size: .85rem;
      letter-spacing: .02em;
      text-align: center;
    }

    #resetBtn {
      display: none;
      width: 100%;
      min-height: 48px;
      margin-top: 10px;
      background: linear-gradient(135deg, #8a4430, #5e2818);
      border: 1px solid #c06040;
      border-radius: 10px;
      font-size: .95rem;
      color: #fde8d8;
      cursor: pointer;
    }
    #resetBtn.visible { display: block; }

    .unlocked-note {
      font-size: .68rem;
      color: var(--muted);
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>
<header>
  <div class="logo">
    Ebû Bekir er-Râzî
    <small>Simya & Tıp Ayini</small>
  </div>
  <div class="room-badge">
    <span>ODA</span>
    <strong id="roomCode">{{ room_id }}</strong>
  </div>
</header>

<div class="status-wrap">
  <div class="status" id="status">Bağlantı kuruluyor…</div>
</div>

<div class="timer-wrap" id="timerWrap">
  <div class="timer-bar-bg">
    <div class="timer-bar-fill" id="timerFill"></div>
  </div>
  <div class="timer-label" id="timerLabel">--</div>
</div>

<main>
  <div class="buttons-container">
    <div class="buttons disabled" id="buttonsGrid">
      <!-- Dinamik yüklenecek butonlar -->
    </div>
  </div>
  <div class="unlocked-note" id="unlockedNote"></div>
  <button id="resetBtn">↻ &nbsp;Yeni Oyun Başlat</button>
</main>

<script>
  const roomId       = {{ room_id|tojson }};
  const statusEl     = document.getElementById('status');
  const gridEl       = document.getElementById('buttonsGrid');
  const timerWrap    = document.getElementById('timerWrap');
  const timerFill    = document.getElementById('timerFill');
  const timerLabel   = document.getElementById('timerLabel');
  const resetBtn     = document.getElementById('resetBtn');
  const unlockedNote = document.getElementById('unlockedNote');

  let elementsMap = {};
  let unlockedList = [];
  let timerTotal   = 0;

  // 30 Element verisini sunucudan çek
  fetch('/razi_elements.json')
    .then(res => res.json())
    .then(data => {
      data.forEach(el => { elementsMap[el.id] = el; });
      renderButtons();
    })
    .catch(err => {
      console.warn("Elementler yüklenirken hata:", err);
      // Fallback 8 element
      const defaultIds = ["civa", "kukurt", "tuz", "demir", "bakir", "kursun", "kalay", "antimon"];
      defaultIds.forEach(id => {
        elementsMap[id] = { id: id, name: id.toUpperCase(), symbol: "☿", color: [140, 140, 160] };
      });
      renderButtons();
    });

  function renderButtons() {
    gridEl.innerHTML = '';
    const activeIds = unlockedList.length > 0 ? unlockedList : Object.keys(elementsMap).slice(0, 8);
    
    if (activeIds.length > 8) {
      gridEl.classList.add('many-cols');
    } else {
      gridEl.classList.remove('many-cols');
    }

    activeIds.forEach(id => {
      const el = elementsMap[id] || { id: id, name: id, symbol: "🜔", color: [120, 110, 100] };
      const btn = document.createElement('button');
      btn.className = 'mat-btn';
      btn.dataset.button = el.id;

      const r = el.color[0], g = el.color[1], b = el.color[2];
      const r2 = Math.floor(r * 0.6), g2 = Math.floor(g * 0.6), b2 = Math.floor(b * 0.6);
      btn.style.background = `linear-gradient(140deg, rgb(${r},${g},${b}), rgb(${r2},${g2},${b2}))`;

      btn.innerHTML = `
        <span class="symbol">${el.symbol}</span>
        <span class="mat-name">${el.name}</span>
      `;

      btn.addEventListener('click', () => sendButton(el.id, btn));
      gridEl.appendChild(btn);
    });

    unlockedNote.textContent = `${activeIds.length} / 30 element açık`;
  }

  function sendButton(matId, btn) {
    if (gridEl.classList.contains('disabled')) return;
    btn.classList.remove('pressed');
    void btn.offsetWidth;
    btn.classList.add('pressed');
    if (navigator.vibrate) navigator.vibrate(22);
    if (socket && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({ button: matId }));
    }
  }

  function updateTimer(remaining, total) {
    timerTotal = total || timerTotal;
    const ratio = timerTotal > 0 ? remaining / timerTotal : 0;
    timerFill.style.width = (ratio * 100).toFixed(1) + '%';
    timerLabel.textContent = Math.ceil(remaining) + 's';
    timerFill.classList.remove('warn', 'urgent');
    if (ratio < 0.2)      timerFill.classList.add('urgent');
    else if (ratio < 0.4) timerFill.classList.add('warn');
    timerWrap.classList.add('visible');
  }

  // WebSocket
  const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
  const socket   = new WebSocket(`${protocol}://${location.host}/ws/${roomId}`);

  socket.addEventListener('open', () => {
    statusEl.textContent = 'Ebû Bekir er-Râzî bekleniyor…';
    statusEl.className   = 'status';
  });

  socket.addEventListener('close', () => {
    statusEl.textContent = 'Bağlantı kesildi — sayfayı yenileyin.';
    statusEl.className   = 'status error';
    gridEl.classList.add('disabled');
    timerWrap.classList.remove('visible');
  });

  socket.addEventListener('message', event => {
    const msg = JSON.parse(event.data);

    if (msg.type === 'round_started') {
      statusEl.textContent = 'Ebû Bekir er-Râzî hazırlanıyor… (İzle)';
      statusEl.className   = 'status';
      gridEl.classList.add('disabled');
      timerWrap.classList.remove('visible');
      resetBtn.classList.remove('visible');
      if (msg.unlocked && Array.isArray(msg.unlocked)) {
        unlockedList = msg.unlocked;
        renderButtons();
      }
    }

    if (msg.type === 'player_turn') {
      statusEl.textContent = 'Sıra Sende! Malzemeleri seç.';
      statusEl.className   = 'status ready';
      gridEl.classList.remove('disabled');
      timerTotal = msg.total || 0;
      updateTimer(timerTotal, timerTotal);
    }

    if (msg.type === 'timer_tick') {
      updateTimer(msg.remaining, msg.total);
    }

    if (msg.type === 'game_over') {
      statusEl.textContent = `Oyun bitti: ${msg.message || 'Kazan taştı.'}`;
      statusEl.className   = 'status error';
      gridEl.classList.add('disabled');
      timerWrap.classList.remove('visible');
      resetBtn.classList.add('visible');
      if (navigator.vibrate) navigator.vibrate([80, 40, 80, 40, 200]);
    }
  });

  resetBtn.addEventListener('click', () => {
    if (navigator.vibrate) navigator.vibrate(18);
    if (socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({ button: 'reset' }));
    }
    resetBtn.classList.remove('visible');
  });
</script>
</body>
</html>
